              )

              data class TehranNavigatorUiState(
                  val isEngineReady: Boolean = false,
                  val loadingProgressPercent: Int = 0,
                  val loadingStatusMessage: String = "در حال آماده‌سازی هسته آفلاین تهران...",
                  val packageStatus: TehranOfflineStorageManager.OfflinePackageStatus? = null,
                  val settings: NavigatorUserSettings = NavigatorUserSettings(),
