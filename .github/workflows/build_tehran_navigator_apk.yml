                  val userSpeedKmh: Float = 0f,
                  val activeSatellitesCount: Int = 0,
                  val constellationsSummary: String = "در جستجوی ماهواره‌ها...",

                  val searchQuery: String = "",
                  val selectedPoiCategory: String? = null,
                  val isSearchingAlongRoute: Boolean = false,
                  val searchResults: List<TehranOfflinePlacesRepository.TehranPlace> = emptyList(),

                  val originPoint: RoutePointSelection? = null,
                  val intermediateWaypoints: List<RoutePointSelection> = emptyList(),
                  val destinationPoint: RoutePointSelection? = null,
                  val calculatedRoutes: List<TehranOfflineRoutingEngine.CalculatedRoute> = emptyList(),
                  val selectedRouteIndex: Int = 0,
                  val routingErrorMessage: String? = null,

                  val navigationState: ActiveTurnByTurnState = ActiveTurnByTurnState(),
                  val isSettingsSheetOpen: Boolean = false,
                  val showSafetyDisclaimerBanner: Boolean = true
              )

              private val storageManager = TehranOfflineStorageManager(application)
              val trafficZoneManager = TehranTrafficZoneManager()
              private val routingEngine = TehranOfflineRoutingEngine(trafficZoneManager)
              private val placesRepository = TehranOfflinePlacesRepository()
              private val gnssFusionEngine = TehranGnssAndTunnelFusionEngine(application)
              private val voiceEngine = TehranPersianVoiceGuidanceEngine(application)
              private val preferencesStore = TehranNavigationPreferencesStore(application)

              private val _uiState = MutableStateFlow(TehranNavigatorUiState())
              val uiState: StateFlow<TehranNavigatorUiState> = _uiState.asStateFlow()

              private var searchDebounceJob: Job? = null
              private var simulationJob: Job? = null
