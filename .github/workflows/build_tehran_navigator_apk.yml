          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun TehranOfflineNavigatorScreen(
              viewModel: TehranNavigationViewModel,
              isNightMode: Boolean
          ) {
              val context = LocalContext.current
              val uiState by viewModel.uiState.collectAsState()
              var mapLibreRef by remember { mutableStateOf<MapLibreMap?>(null) }

              val permissionLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.RequestMultiplePermissions()
              ) { permissions ->
                  if (permissions[Manifest.permission.ACCESS_FINE_LOCATION] == true) {
                      viewModel.onLocationPermissionGranted()
                  }
              }

              LaunchedEffect(Unit) {
                  val requiredPermissions = buildList {
                      add(Manifest.permission.ACCESS_FINE_LOCATION)
                      add(Manifest.permission.ACCESS_COARSE_LOCATION)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          add(Manifest.permission.POST_NOTIFICATIONS)
                      }
                  }
                  val allGranted = requiredPermissions.all {
                      ContextCompat.checkSelfPermission(context, it) == PackageManager.PERMISSION_GRANTED
                  }
                  if (allGranted) {
                      viewModel.onLocationPermissionGranted()
                  } else {
                      permissionLauncher.launch(requiredPermissions.toTypedArray())
                  }
              }

              LaunchedEffect(
                  mapLibreRef,
                  uiState.calculatedRoutes,
                  uiState.selectedRouteIndex,
                  uiState.settings.showTrafficZonesOverlay
              ) {
                  val map = mapLibreRef ?: return@LaunchedEffect
                  map.renderTehranTrafficZonesOverlay(
                      zoneManager = viewModel.trafficZoneManager,
                      visible = uiState.settings.showTrafficZonesOverlay
                  )
                  if (uiState.calculatedRoutes.isEmpty()) {
                      map.clearRenderedRoutes()
                  } else {
                      map.renderCalculatedRoutes(
                          routes = uiState.calculatedRoutes,
                          selectedRouteIndex = uiState.selectedRouteIndex,
                          fitCameraToRoute = !uiState.navigationState.isNavigating
                      )
                  }
              }

              LaunchedEffect(
                  mapLibreRef,
                  uiState.navigationState.isNavigating,
                  uiState.userLat,
                  uiState.userLon,
                  uiState.userBearing
              ) {
                  val map = mapLibreRef ?: return@LaunchedEffect
                  if (uiState.navigationState.isNavigating) {
                      val camPos = CameraPosition.Builder()
                          .target(LatLng(uiState.userLat, uiState.userLon))
                          .zoom(16.2)
                          .bearing(uiState.userBearing.toDouble())
                          .tilt(if (uiState.settings.is3DBuildingsEnabled) 52.0 else 0.0)
                          .build()
                      map.animateCamera(CameraUpdateFactory.newCameraPosition(camPos), 450)
                  }
              }

              Box(modifier = Modifier.fillMaxSize()) {
                  TehranMapComposable(
                      modifier = Modifier.fillMaxSize(),
                      isNightMode = isNightMode,
                      is3DTiltEnabled = uiState.settings.is3DBuildingsEnabled,
                      isPowerSavingCruising = (uiState.navigationState.isNavigating &&
                              uiState.settings.performanceMode != HardwarePerformanceMode.SMOOTH_120HZ),
                      storageLocation = uiState.settings.storageLocation,
                      onMapReady = { map -> mapLibreRef = map },
                      onMapLongClick = { latLng ->
                          viewModel.selectDestinationFromMapTap(latLng.latitude, latLng.longitude)
                      }
                  )

                  if (!uiState.isEngineReady) {
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(Color.Black.copy(alpha = 0.88f)),
                          contentAlignment = Alignment.Center
                      ) {
                          Card(
                              modifier = Modifier.fillMaxWidth().padding(24.dp),
                              shape = RoundedCornerShape(24.dp)
                          ) {
                              Column(
                                  modifier = Modifier.padding(24.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally,
                                  verticalArrangement = Arrangement.spacedBy(16.dp)
                              ) {
                                  CircularProgressIndicator()
                                  Text("مسیریاب ۱۰۰٪ آفلاین تهران", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)
                                  Text(uiState.loadingStatusMessage, style = MaterialTheme.typography.bodyMedium)
                                  LinearProgressIndicator(
                                      progress = { uiState.loadingProgressPercent / 100f },
                                      modifier = Modifier.fillMaxWidth()
                                  )
                              }
                          }
                      }
                      return@Box
                  }

                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .statusBarsPadding()
                          .padding(12.dp)
                          .align(Alignment.TopCenter),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      if (uiState.navigationState.isNavigating) {
                          ActiveTurnByTurnBanner(
                              navState = uiState.navigationState,
                              speedKmh = uiState.userSpeedKmh,
                              onSearchFuelAlongRoute = { viewModel.searchByQuickCategory("fuel", alongActiveRoute = true) }
                          )
                      } else {
                          SearchAndTrafficHeaderCard(
                              searchQuery = uiState.searchQuery,
                              trafficSummary = uiState.trafficPolicyStatus.statusSummaryFa,
                              isTrafficActive = uiState.trafficPolicyStatus.isMainTrafficZoneActive ||
                                      uiState.trafficPolicyStatus.isAirPollutionZoneActive,
                              onQueryChange = viewModel::onSearchQueryChanged,
                              onClearSearch = viewModel::clearSearchResults,
                              onQuickCategoryClick = { cat -> viewModel.searchByQuickCategory(cat, false) },
                              onOpenSettingsClick = { viewModel.toggleSettingsSheet(true) }
                          )
                      }

                      if (uiState.searchResults.isNotEmpty()) {
                          Card(
                              modifier = Modifier.fillMaxWidth().heightIn(max = 310.dp),
                              shape = RoundedCornerShape(20.dp),
                              elevation = CardDefaults.cardElevation(8.dp)
                          ) {
                              LazyColumn(contentPadding = PaddingValues(vertical = 6.dp)) {
                                  items(uiState.searchResults) { place ->
                                      Row(
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .clickable { viewModel.selectPlaceAsDestination(place) }
                                              .padding(horizontal = 16.dp, vertical = 10.dp),
                                          verticalAlignment = Alignment.CenterVertically,
                                          horizontalArrangement = Arrangement.SpaceBetween
                                      ) {
                                          Column(modifier = Modifier.weight(1f)) {
                                              Text(place.name, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                              Text(
                                                  text = "${place.categoryFa} • ${place.addressHint}",
                                                  style = MaterialTheme.typography.bodySmall,
                                                  color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.7f),
                                                  maxLines = 1,
                                                  overflow = TextOverflow.Ellipsis
                                              )
                                          }
                                          place.distanceMeters?.let { dist ->
                                              val distLabel = if (dist >= 1000) {
                                                  String.format(Locale("fa"), "%.1f ک.م", dist / 1000.0)
                                              } else {
                                                  "${dist.toInt()} متر"
                                              }
                                              Text(distLabel, style = MaterialTheme.typography.labelMedium, color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold)
                                          }
                                      }
                                      HorizontalDivider(thickness = 0.5.dp)
                                  }
                              }
                          }
                      }
                  }

                  IconButton(
                      onClick = {
                          mapLibreRef?.animateCamera(
                              CameraUpdateFactory.newLatLngZoom(LatLng(uiState.userLat, uiState.userLon), 15.0),
                              500
                          )
                      },
                      modifier = Modifier
                          .align(Alignment.CenterEnd)
                          .padding(end = 14.dp)
                          .size(48.dp)
                          .background(MaterialTheme.colorScheme.surface.copy(alpha = 0.92f), CircleShape)
                  ) {
                      Icon(Icons.Rounded.MyLocation, contentDescription = "موقعیت من", tint = MaterialTheme.colorScheme.primary)
                  }

                  Column(
                      modifier = Modifier.align(Alignment.BottomCenter).fillMaxWidth().padding(12.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      if (uiState.showSafetyDisclaimerBanner && !uiState.navigationState.isNavigating) {
                          Card(
                              shape = RoundedCornerShape(16.dp),
                              colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface.copy(alpha = 0.94f))
                          ) {
                              Row(
                                  modifier = Modifier.padding(horizontal = 12.dp, vertical = 8.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(
                                      text = "لطفاً هنگام رانندگی به قوانین و تابلوهای راهنمایی توجه کنید و تنظیمات را پیش از حرکت انجام دهید.",
                                      style = MaterialTheme.typography.bodySmall,
                                      modifier = Modifier.weight(1f)
                                  )
                                  IconButton(onClick = viewModel::dismissSafetyBanner, modifier = Modifier.size(28.dp)) {
                                      Icon(Icons.Rounded.Close, contentDescription = "بستن", modifier = Modifier.size(16.dp))
                                  }
                              }
                          }
                      }

                      if (uiState.navigationState.isNavigating) {
                          ActiveNavigationBottomBar(navState = uiState.navigationState, onStopNavigation = viewModel::stopNavigation)
                      } else if (uiState.calculatedRoutes.isNotEmpty()) {
                          RoutePreviewBottomCard(
                              uiState = uiState,
                              onModeSelected = { mode -> viewModel.updateUserPreferences { it.copy(transportMode = mode) } },
                              onRouteSelected = viewModel::selectAlternativeRoute,
                              onStartRealNavigation = { viewModel.startNavigation(simulationMode = false) },
                              onStartSimulation = { viewModel.startNavigation(simulationMode = true, speedMultiplier = 3) },
                              onClearRoute = viewModel::clearRoute
                          )
                      } else {
                          Surface(
                              shape = RoundedCornerShape(16.dp),
                              color = MaterialTheme.colorScheme.surface.copy(alpha = 0.92f),
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Row(
                                  modifier = Modifier.padding(horizontal = 14.dp, vertical = 10.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text("برای انتخاب مقصد جستجو کنید یا روی نقشه لمس طولانی نمایید", style = MaterialTheme.typography.bodySmall, modifier = Modifier.weight(1f))
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Text("${uiState.activeSatellitesCount} ماهواره", style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }

                  if (uiState.isSettingsSheetOpen) {
                      ModalBottomSheet(onDismissRequest = { viewModel.toggleSettingsSheet(false) }) {
                          ComprehensiveSettingsSheetContent(
                              uiState = uiState,
                              onUpdateSettings = viewModel::updateUserPreferences,
                              onMigrateStorage = viewModel::migrateStorageLocation
                          )
                      }
                  }
              }
          }

          @Composable
          private fun SearchAndTrafficHeaderCard(
              searchQuery: String,
              trafficSummary: String,
              isTrafficActive: Boolean,
              onQueryChange: (String) -> Unit,
              onClearSearch: () -> Unit,
              onQuickCategoryClick: (String) -> Unit,
              onOpenSettingsClick: () -> Unit
          ) {
              Card(
                  shape = RoundedCornerShape(22.dp),
                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface.copy(alpha = 0.96f)),
                  elevation = CardDefaults.cardElevation(6.dp)
              ) {
                  Column(modifier = Modifier.padding(12.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          OutlinedTextField(
                              value = searchQuery,
                              onValueChange = onQueryChange,
                              modifier = Modifier.weight(1f),
                              placeholder = { Text("جستجوی آفلاین محله، خیابان، مترو، پمپ بنزین...", fontSize = 13.sp) },
                              leadingIcon = { Icon(Icons.Rounded.Search, contentDescription = null) },
                              trailingIcon = {
                                  if (searchQuery.isNotEmpty()) {
                                      IconButton(onClick = onClearSearch) { Icon(Icons.Rounded.Close, contentDescription = "پاک کردن") }
                                  }
                              },
                              singleLine = true,
                              shape = RoundedCornerShape(14.dp)
                          )
                          Spacer(modifier = Modifier.width(8.dp))
                          IconButton(
                              onClick = onOpenSettingsClick,
                              modifier = Modifier.size(48.dp).background(MaterialTheme.colorScheme.primary.copy(alpha = 0.14f), RoundedCornerShape(14.dp))
                          ) {
                              Icon(Icons.Rounded.Settings, contentDescription = "تنظیمات", tint = MaterialTheme.colorScheme.primary)
                          }
                      }

                      Text(
                          text = trafficSummary,
                          style = MaterialTheme.typography.labelSmall,
                          color = if (isTrafficActive) Color(0xFFF59E0B) else Color(0xFF10B981),
                          fontWeight = FontWeight.Bold
                      )

                      Row(
                          modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),
                          horizontalArrangement = Arrangement.spacedBy(6.dp)
                      ) {
                          FilterChip(selected = false, onClick = { onQuickCategoryClick("fuel") }, label = { Text("پمپ بنزین", fontSize = 12.sp) }, leadingIcon = { Icon(Icons.Rounded.LocalGasStation, null, modifier = Modifier.size(16.dp)) })
                          FilterChip(selected = false, onClick = { onQuickCategoryClick("metro") }, label = { Text("ایستگاه مترو", fontSize = 12.sp) }, leadingIcon = { Icon(Icons.Rounded.Subway, null, modifier = Modifier.size(16.dp)) })
                          FilterChip(selected = false, onClick = { onQuickCategoryClick("hospital") }, label = { Text("بیمارستان", fontSize = 12.sp) }, leadingIcon = { Icon(Icons.Rounded.LocalHospital, null, modifier = Modifier.size(16.dp)) })
                          FilterChip(selected = false, onClick = { onQuickCategoryClick("pharmacy") }, label = { Text("داروخانه", fontSize = 12.sp) }, leadingIcon = { Icon(Icons.Rounded.LocalPharmacy, null, modifier = Modifier.size(16.dp)) })
                      }
                  }
              }
          }

          @Composable
          private fun ActiveTurnByTurnBanner(
              navState: TehranNavigationViewModel.ActiveTurnByTurnState,
              speedKmh: Float,
              onSearchFuelAlongRoute: () -> Unit
          ) {
              Card(
                  shape = RoundedCornerShape(22.dp),
                  colors = CardDefaults.cardColors(containerColor = Color(0xFF065F46)),
                  elevation = CardDefaults.cardElevation(8.dp)
              ) {
                  Column(modifier = Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          val turnIcon = when (navState.currentTurnSign) {
                              -2, -1 -> Icons.Rounded.TurnLeft
                              1, 2 -> Icons.Rounded.TurnRight
                              -3, 3 -> Icons.Rounded.UTurnLeft
                              else -> Icons.Rounded.Navigation
                          }
                          Box(
                              modifier = Modifier.size(52.dp).background(Color(0xFF047857), RoundedCornerShape(14.dp)),
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(turnIcon, contentDescription = null, tint = Color.White, modifier = Modifier.size(32.dp))
                          }
                          Spacer(modifier = Modifier.width(12.dp))
                          Column(modifier = Modifier.weight(1f)) {
                              Text("${navState.distanceToNextTurnMeters.toInt()} متر دیگر", color = Color(0xFFA7F3D0), fontWeight = FontWeight.Bold, fontSize = 14.sp)
                              Text(navState.currentInstructionFa, color = Color.White, fontWeight = FontWeight.Black, fontSize = 16.sp, maxLines = 2)
                              Text(navState.currentStreetName, color = Color(0xFFD1FAE5), fontSize = 12.sp)
                          }
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Text("${speedKmh.toInt()}", color = Color.White, fontWeight = FontWeight.Black, fontSize = 20.sp)
                              Text("km/h", color = Color(0xFFA7F3D0), fontSize = 10.sp)
                          }
                      }

                      if (navState.isTunnelDeadReckoning) {
                          Text("حالت ناوبری هوشمند داخل تونل فعال است", color = Color(0xFFFDE047), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                      }

                      Row(horizontalArrangement = Arrangement.End, modifier = Modifier.fillMaxWidth()) {
                          OutlinedButton(onClick = onSearchFuelAlongRoute, contentPadding = PaddingValues(horizontal = 10.dp, vertical = 2.dp), modifier = Modifier.height(30.dp)) {
                              Text("جستجوی پمپ بنزین در مسیر", color = Color.White, fontSize = 11.sp)
                          }
                      }
                  }
              }
          }

          @Composable
          private fun RoutePreviewBottomCard(
              uiState: TehranNavigationViewModel.TehranNavigatorUiState,
              onModeSelected: (TransportMode) -> Unit,
              onRouteSelected: (Int) -> Unit,
              onStartRealNavigation: () -> Unit,
              onStartSimulation: () -> Unit,
              onClearRoute: () -> Unit
          ) {
              Card(
                  shape = RoundedCornerShape(24.dp),
                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface.copy(alpha = 0.97f)),
                  elevation = CardDefaults.cardElevation(10.dp)
              ) {
                  Column(modifier = Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween, modifier = Modifier.fillMaxWidth()) {
                          Text("مقصد: ${uiState.destinationPoint?.title ?: ""}", fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f))
                          IconButton(onClick = onClearRoute, modifier = Modifier.size(28.dp)) { Icon(Icons.Rounded.Close, contentDescription = "لغو مسیر") }
                      }

                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
                          val modes = listOf(
                              Triple(TransportMode.CAR, "خودرو", Icons.Rounded.DirectionsCar),
                              Triple(TransportMode.MOTORCYCLE, "موتور", Icons.Rounded.DirectionsBike),
                              Triple(TransportMode.PEDESTRIAN, "پیاده", Icons.Rounded.DirectionsWalk)
                          )
                          modes.forEach { (mode, title, icon) ->
                              FilterChip(
                                  selected = uiState.settings.transportMode == mode,
                                  onClick = { onModeSelected(mode) },
                                  label = { Text(title, fontSize = 12.sp) },
                                  leadingIcon = { Icon(icon, null, modifier = Modifier.size(16.dp)) },
                                  modifier = Modifier.weight(1f)
                              )
                          }
                      }

                      Row(modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          uiState.calculatedRoutes.forEachIndexed { idx, route ->
                              val isSelected = idx == uiState.selectedRouteIndex
                              val mins = (route.durationMillis / 60000L).coerceAtLeast(1)
                              val km = route.distanceMeters / 1000.0
                              Card(
                                  onClick = { onRouteSelected(idx) },
                                  colors = CardDefaults.cardColors(containerColor = if (isSelected) MaterialTheme.colorScheme.primary.copy(alpha = 0.2f) else MaterialTheme.colorScheme.surface),
                                  shape = RoundedCornerShape(14.dp)
                              ) {
                                  Column(modifier = Modifier.padding(10.dp)) {
                                      Text(route.labelFa, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                      Text(String.format(Locale("fa"), "%d دقیقه (%.1f ک.م)", mins, km), fontSize = 13.sp, fontWeight = FontWeight.Black, color = MaterialTheme.colorScheme.primary)
                                  }
                              }
                          }
                      }

                      uiState.calculatedRoutes.getOrNull(uiState.selectedRouteIndex)?.crossesTrafficZoneWarning?.let { warning ->
                          Text(warning, color = Color(0xFFF59E0B), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                      }

                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
                          Button(onClick = onStartRealNavigation, modifier = Modifier.weight(1.4f), shape = RoundedCornerShape(14.dp)) {
                              Icon(Icons.Rounded.Navigation, contentDescription = null)
                              Spacer(modifier = Modifier.width(6.dp))
                              Text("شروع مسیریابی", fontWeight = FontWeight.Bold)
                          }
                          OutlinedButton(onClick = onStartSimulation, modifier = Modifier.weight(1f), shape = RoundedCornerShape(14.dp)) {
                              Icon(Icons.Rounded.PlayArrow, contentDescription = null)
                              Spacer(modifier = Modifier.width(4.dp))
                              Text("شبیه‌ساز 3x", fontSize = 12.sp)
                          }
                      }
                  }
              }
          }

          @Composable
          private fun ActiveNavigationBottomBar(
              navState: TehranNavigationViewModel.ActiveTurnByTurnState,
              onStopNavigation: () -> Unit
          ) {
              val remMins = (navState.remainingDurationMillis / 60000L).coerceAtLeast(1)
              val remKm = navState.remainingDistanceMeters / 1000.0
              Card(shape = RoundedCornerShape(22.dp), colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)) {
                  Row(modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 12.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                      Column {
                          Text(String.format(Locale("fa"), "%d دقیقه تا مقصد", remMins), fontWeight = FontWeight.Black, fontSize = 17.sp, color = MaterialTheme.colorScheme.primary)
                          Text(String.format(Locale("fa"), "مسافت باقی‌مانده: %.1f کیلومتر", remKm), style = MaterialTheme.typography.bodySmall)
                      }
                      Button(onClick = onStopNavigation, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFDC2626)), shape = RoundedCornerShape(14.dp)) {
                          Text("پایان حرکت", color = Color.White, fontWeight = FontWeight.Bold)
                      }
                  }
              }
          }

          @Composable
          private fun ComprehensiveSettingsSheetContent(
              uiState: TehranNavigationViewModel.TehranNavigatorUiState,
              onUpdateSettings: ((TehranNavigationPreferencesStore.NavigatorUserSettings) -> TehranNavigationPreferencesStore.NavigatorUserSettings) -> Unit,
              onMigrateStorage: (StorageLocation) -> Unit
          ) {
              val settings = uiState.settings
              Column(
                  modifier = Modifier.fillMaxWidth().verticalScroll(rememberScrollState()).padding(horizontal = 20.dp, vertical = 8.dp),
                  verticalArrangement = Arrangement.spacedBy(14.dp)
              ) {
                  Text("تنظیمات جامع مسیریاب آفلاین تهران", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Black)
                  Text("۱. قوانین طرح ترافیک و آلودگی هوای تهران", fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                  SettingSwitchRow("دارای مجوز طرح ترافیک اصلی", settings.hasMainTrafficPermit) { v -> onUpdateSettings { it.copy(hasMainTrafficPermit = v) } }
                  SettingSwitchRow("دارای مجوز / سهمیه کنترل آلودگی هوا", settings.hasAirPollutionPermit) { v -> onUpdateSettings { it.copy(hasAirPollutionPermit = v) } }
                  SettingSwitchRow("نمایش محدوده طرح روی نقشه", settings.showTrafficZonesOverlay) { v -> onUpdateSettings { it.copy(showTrafficZonesOverlay = v) } }

                  HorizontalDivider()
                  Text("۲. راهنمای صوتی فارسی (TTS)", fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                  VoiceGuidanceLevel.entries.forEach { level ->
                      FilterChip(selected = settings.voiceGuidanceLevel == level, onClick = { onUpdateSettings { it.copy(voiceGuidanceLevel = level) } }, label = { Text(level.titleFa) }, modifier = Modifier.fillMaxWidth())
                  }

                  HorizontalDivider()
                  Text("۳. نمایشگر Super AMOLED و سخت‌افزار Galaxy A54", fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                  AppThemePreference.entries.forEach { themePref ->
                      FilterChip(selected = settings.themePreference == themePref, onClick = { onUpdateSettings { it.copy(themePreference = themePref) } }, label = { Text(themePref.titleFa) }, modifier = Modifier.fillMaxWidth())
                  }
                  SettingSwitchRow("نمایش سه‌بعدی ساختمان‌های تهران (3D Extrusion)", settings.is3DBuildingsEnabled) { v -> onUpdateSettings { it.copy(is3DBuildingsEnabled = v) } }

                  HardwarePerformanceMode.entries.forEach { perf ->
                      FilterChip(selected = settings.performanceMode == perf, onClick = { onUpdateSettings { it.copy(performanceMode = perf) } }, label = { Text(perf.titleFa) }, modifier = Modifier.fillMaxWidth())
                  }

                  Text("حساسیت بازمحاسبه خودکار مسیر: ${settings.rerouteThresholdMeters.toInt()} متر", fontSize = 13.sp)
                  Slider(value = settings.rerouteThresholdMeters, onValueChange = { v -> onUpdateSettings { it.copy(rerouteThresholdMeters = v) } }, valueRange = 25f..100f)

                  HorizontalDivider()
                  Text("۴. محل ذخیره‌سازی پکیج آفلاین تهران", fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                  uiState.packageStatus?.let { pkg ->
                      Text(String.format(Locale("fa"), "حجم دیتای نصب‌شده: %.1f مگابایت | فضای آزاد: %d مگابایت", pkg.totalSizeMb, pkg.availableSpaceMb), style = MaterialTheme.typography.bodySmall)
                  }
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
                      FilterChip(selected = settings.storageLocation == StorageLocation.INTERNAL_UFS, onClick = { onMigrateStorage(StorageLocation.INTERNAL_UFS) }, label = { Text("حافظه داخلی UFS") }, modifier = Modifier.weight(1f))
                      FilterChip(selected = settings.storageLocation == StorageLocation.EXTERNAL_SD, onClick = { onMigrateStorage(StorageLocation.EXTERNAL_SD) }, label = { Text("کارت MicroSD") }, modifier = Modifier.weight(1f))
                  }
                  Spacer(modifier = Modifier.height(24.dp))
              }
          }

          @Composable
          private fun SettingSwitchRow(title: String, checked: Boolean, onCheckedChange: (Boolean) -> Unit) {
              Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                  Text(title, style = MaterialTheme.typography.bodyMedium, modifier = Modifier.weight(1f))
                  Switch(checked = checked, onCheckedChange = onCheckedChange)
              }
          }
          ''')

          # 6. Copy Tehran Offline Data into Android Assets
          os.makedirs("app/src/main/assets/map", exist_ok=True)
          os.makedirs("app/src/main/assets/database", exist_ok=True)
          os.makedirs("app/src/main/assets/routing", exist_ok=True)

          shutil.copy("data_pipeline/tehran_vector.pmtiles", "app/src/main/assets/map/tehran_vector.pmtiles")
          shutil.copy("data_pipeline/tehran_places_fts5.db", "app/src/main/assets/database/tehran_places_fts5.db")
          shutil.copytree("data_pipeline/tehran_routing_graph", "app/src/main/assets/routing/tehran_routing_graph", dirs_exist_ok=True)
          print("All offline Tehran assets successfully bundled into app/src/main/assets!")
          EOF

      - name: ۹. راه‌اندازی Gradle و تولید کلید امضای APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: ۱۰. کامپایل نهایی و ساخت فایل نصبی امضاشده برای Samsung Galaxy A54
        run: |
          keytool -genkeypair -v \
            -keystore app/tehran_release.keystore \
            -alias tehran_nav \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass tehran_offline_key \
            -keypass tehran_offline_key \
            -dname "CN=TehranOfflineNavigator, OU=Mobile, O=Tehran, L=Tehran, C=IR"
          gradle assembleRelease --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/release/

