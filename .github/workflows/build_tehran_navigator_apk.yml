              private fun observeUserSettings() {
                  viewModelScope.launch {
                      preferencesStore.settingsFlow.collectLatest { newSettings ->
                          val oldMode = _uiState.value.settings.transportMode
                          val oldMainPermit = _uiState.value.settings.hasMainTrafficPermit
                          val oldPollutionPermit = _uiState.value.settings.hasAirPollutionPermit

                          _uiState.update { it.copy(settings = newSettings) }
                          voiceEngine.updateSettings(newSettings.voiceGuidanceLevel, newSettings.voiceSpeechRate)

                          if (_uiState.value.isEngineReady &&
                              _uiState.value.destinationPoint != null &&
                              (oldMode != newSettings.transportMode ||
                               oldMainPermit != newSettings.hasMainTrafficPermit ||
                               oldPollutionPermit != newSettings.hasAirPollutionPermit)
                          ) {
                              recalculateCurrentRoute()
                          }
                      }
                  }
              }

              private fun initializeOfflineEngines() {
                  viewModelScope.launch {
                      val extracted = storageManager.extractBundledAssetsIfNeeded { pct, msg ->
                          _uiState.update { it.copy(loadingProgressPercent = pct, loadingStatusMessage = msg) }
                      }

                      val pkgStatus = storageManager.checkPackageStatus(_uiState.value.settings.storageLocation)
                      if (!extracted || !pkgStatus.isReady) {
                          _uiState.update {
                              it.copy(
                                  isEngineReady = false,
                                  packageStatus = pkgStatus,
                                  loadingStatusMessage = "فایل‌های نقشه آفلاین تهران یافت نشدند."
                              )
                          }
                          return@launch
                      }

                      val dbOpened = placesRepository.open(pkgStatus.placesDbPath)
                      val routingLoaded = routingEngine.initialize(
                          graphDirPath = pkgStatus.routingGraphDirPath,
                          placesDbPath = pkgStatus.placesDbPath
                      )

                      _uiState.update {
                          it.copy(
                              isEngineReady = dbOpened && routingLoaded,
                              packageStatus = pkgStatus,
                              loadingProgressPercent = 100,
                              loadingStatusMessage = if (dbOpened && routingLoaded) {
                                  "سیستم ۱۰۰٪ آفلاین تهران آماده است"
                              } else {
                                  "خطا در بارگذاری موتور مسیریابی تهران"
                              }
                          )
                      }
                  }
              }

              fun onLocationPermissionGranted() {
                  gnssFusionEngine.startTracking()
              }

              private fun observeLiveGnssUpdates() {
                  viewModelScope.launch {
                      gnssFusionEngine.locationFlow.collectLatest { loc ->
                          if (!_uiState.value.navigationState.isSimulationMode) {
                              _uiState.update {
                                  it.copy(
                                      userLat = loc.lat,
                                      userLon = loc.lon,
                                      userBearing = loc.bearingDegrees,
                                      userSpeedKmh = loc.speedKmh,
                                      activeSatellitesCount = loc.usedSatellitesCount,
                                      constellationsSummary = loc.activeConstellationsSummary
                                  )
                              }

                              if (_uiState.value.navigationState.isNavigating) {
                                  evaluateActiveNavigationProgress(
                                      currentLat = loc.lat,
                                      currentLon = loc.lon,
                                      speedKmh = loc.speedKmh,
                                      isTunnelDr = loc.isTunnelDeadReckoningActive
                                  )
                              }
                          }
                      }
                  }
              }

              fun onSearchQueryChanged(query: String) {
                  _uiState.update {
                      it.copy(searchQuery = query, selectedPoiCategory = null, isSearchingAlongRoute = false)
                  }
                  searchDebounceJob?.cancel()

                  if (query.isBlank()) {
                      _uiState.update { it.copy(searchResults = emptyList()) }
                      return
                  }

                  searchDebounceJob = viewModelScope.launch {
                      delay(120L)
                      val state = _uiState.value
                      val results = placesRepository.searchByText(
                          rawQuery = query,
                          userLat = state.userLat,
                          userLon = state.userLon,
                          limit = 30
                      )
                      _uiState.update { it.copy(searchResults = results) }
                  }
              }

              fun searchByQuickCategory(categoryCode: String, alongActiveRoute: Boolean = false) {
                  viewModelScope.launch {
                      val state = _uiState.value
                      val activeRoute = state.calculatedRoutes.getOrNull(state.selectedRouteIndex)

                      val results = if (alongActiveRoute && activeRoute != null) {
                          placesRepository.searchAlongRoute(
                              routePoints = activeRoute.geometryPoints,
                              categoryFilter = categoryCode,
                              maxDetourMeters = 350.0,
                              limit = 20
                          )
                      } else {
                          placesRepository.searchNearby(
                              centerLat = state.userLat,
                              centerLon = state.userLon,
                              radiusMeters = 3500.0,
                              categoryFilter = categoryCode,
                              limit = 25
                          )
                      }

                      _uiState.update {
                          it.copy(
                              searchQuery = "",
                              selectedPoiCategory = categoryCode,
                              isSearchingAlongRoute = alongActiveRoute && activeRoute != null,
                              searchResults = results
                          )
                      }
                  }
              }

              fun clearSearchResults() {
                  _uiState.update {
                      it.copy(searchQuery = "", selectedPoiCategory = null, isSearchingAlongRoute = false, searchResults = emptyList())
                  }
              }

              fun selectDestinationFromMapTap(lat: Double, lon: Double) {
                  viewModelScope.launch {
                      val resolvedAddress = placesRepository.reverseGeocodeOffline(lat, lon)
                      setDestinationAndCalculateRoute(RoutePointSelection(title = resolvedAddress, lat = lat, lon = lon))
                  }
              }

              fun selectPlaceAsDestination(place: TehranOfflinePlacesRepository.TehranPlace) {
                  clearSearchResults()
                  if (_uiState.value.navigationState.isNavigating && _uiState.value.destinationPoint != null) {
                      addIntermediateWaypoint(RoutePointSelection(place.name, place.lat, place.lon))
                  } else {
                      setDestinationAndCalculateRoute(RoutePointSelection(place.name, place.lat, place.lon))
                  }
              }

              fun setDestinationAndCalculateRoute(destination: RoutePointSelection) {
                  val state = _uiState.value
                  val origin = state.originPoint ?: RoutePointSelection(
                      title = "موقعیت فعلی من",
                      lat = state.userLat,
                      lon = state.userLon
                  )
                  _uiState.update { it.copy(originPoint = origin, destinationPoint = destination, routingErrorMessage = null) }
                  recalculateCurrentRoute()
              }

              fun addIntermediateWaypoint(waypoint: RoutePointSelection) {
                  _uiState.update { it.copy(intermediateWaypoints = it.intermediateWaypoints + waypoint) }
                  recalculateCurrentRoute()
              }

              fun clearRoute() {
                  stopNavigation()
                  gnssFusionEngine.updateActiveRoutePolyline(emptyList())
                  _uiState.update {
                      it.copy(
                          originPoint = null,
                          intermediateWaypoints = emptyList(),
                          destinationPoint = null,
                          calculatedRoutes = emptyList(),
                          selectedRouteIndex = 0,
                          routingErrorMessage = null
                      )
                  }
              }

              fun selectAlternativeRoute(index: Int) {
                  if (index in _uiState.value.calculatedRoutes.indices) {
                      _uiState.update { it.copy(selectedRouteIndex = index) }
                      val route = _uiState.value.calculatedRoutes[index]
                      gnssFusionEngine.updateActiveRoutePolyline(route.geometryPoints)
                  }
              }

              fun recalculateCurrentRoute() {
                  val state = _uiState.value
                  val origin = state.originPoint ?: return
                  val dest = state.destinationPoint ?: return

                  viewModelScope.launch {
                      val waypoints = buildList {
                          add(origin.lat to origin.lon)
                          state.intermediateWaypoints.forEach { add(it.lat to it.lon) }
                          add(dest.lat to dest.lon)
                      }

                      val prefs = TehranOfflineRoutingEngine.RoutingPreferences(
                          mode = state.settings.transportMode,
                          hasMainTrafficPermit = state.settings.hasMainTrafficPermit,
                          hasAirPollutionPermit = state.settings.hasAirPollutionPermit,
                          motorcyclesExemptFromPollutionZone = state.settings.motorcyclesExemptFromPollution,
                          computeAlternativeRoutes = state.settings.computeAlternativeRoutes
                      )

                      when (val result = routingEngine.calculateRoute(waypoints, prefs)) {
                          is TehranOfflineRoutingEngine.RoutingResult.Success -> {
                              val primaryRoute = result.routes.firstOrNull()
                              if (primaryRoute != null) {
                                  gnssFusionEngine.updateActiveRoutePolyline(primaryRoute.geometryPoints)
                              }
                              _uiState.update {
                                  it.copy(
                                      calculatedRoutes = result.routes,
                                      selectedRouteIndex = 0,
                                      trafficPolicyStatus = result.policyStatus,
                                      routingErrorMessage = null
                                  )
                              }
                          }
                          is TehranOfflineRoutingEngine.RoutingResult.Error -> {
                              _uiState.update { it.copy(routingErrorMessage = result.messageFa) }
                          }
                      }
                  }
              }

              fun startNavigation(simulationMode: Boolean = false, speedMultiplier: Int = 1) {
                  val state = _uiState.value
                  val activeRoute = state.calculatedRoutes.getOrNull(state.selectedRouteIndex) ?: return
                  val firstStep = activeRoute.steps.firstOrNull() ?: return

                  simulationJob?.cancel()
                  gnssFusionEngine.updateActiveRoutePolyline(activeRoute.geometryPoints)

                  _uiState.update {
                      it.copy(
                          navigationState = ActiveTurnByTurnState(
                              isNavigating = true,
                              isSimulationMode = simulationMode,
                              simulationSpeedMultiplier = speedMultiplier,
                              currentStepIndex = 0,
                              currentInstructionFa = firstStep.instructionTextFa,
                              currentStreetName = firstStep.streetName,
                              currentTurnSign = firstStep.turnSign,
                              distanceToNextTurnMeters = firstStep.distanceMeters,
                              remainingDistanceMeters = activeRoute.distanceMeters,
                              remainingDurationMillis = activeRoute.durationMillis
                          )
                      )
                  }

                  voiceEngine.announceSystemEvent("مسیریابی آغاز شد. ${firstStep.instructionTextFa}")

                  if (simulationMode) {
                      runRouteSimulationLoop(activeRoute, speedMultiplier)
                  }
              }

              fun stopNavigation() {
                  simulationJob?.cancel()
                  _uiState.update { it.copy(navigationState = ActiveTurnByTurnState(isNavigating = false)) }
              }

              private fun evaluateActiveNavigationProgress(
                  currentLat: Double,
                  currentLon: Double,
                  speedKmh: Float,
                  isTunnelDr: Boolean
              ) {
                  val state = _uiState.value
                  val route = state.calculatedRoutes.getOrNull(state.selectedRouteIndex) ?: return
                  val dest = state.destinationPoint ?: return

                  val distToDest = PersianTextNormalizer.haversineDistanceMeters(
                      currentLat, currentLon, dest.lat, dest.lon
                  )
                  if (distToDest <= 30.0) {
                      voiceEngine.announceSystemEvent("شما به مقصد خود رسیدید.")
                      stopNavigation()
                      return
                  }

                  if (!state.navigationState.isSimulationMode && !isTunnelDr && route.geometryPoints.size >= 2) {
                      var minCrossTrackDist = Double.MAX_VALUE
                      for (i in 0 until route.geometryPoints.size - 1) {
                          val (aLat, aLon) = route.geometryPoints[i]
                          val (bLat, bLon) = route.geometryPoints[i + 1]
                          val d = PersianTextNormalizer.distancePointToSegmentMeters(
                              currentLat, currentLon, aLat, aLon, bLat, bLon
                          )
                          if (d < minCrossTrackDist) minCrossTrackDist = d
                      }

                      val now = System.currentTimeMillis()
                      if (minCrossTrackDist > state.settings.rerouteThresholdMeters &&
                          (now - lastRerouteTimestampMillis) > 8_000L
                      ) {
                          lastRerouteTimestampMillis = now
                          voiceEngine.announceSystemEvent("خروج از مسیر؛ در حال محاسبه مجدد مسیر")
                          _uiState.update {
                              it.copy(
                                  originPoint = RoutePointSelection("موقعیت جدید", currentLat, currentLon),
                                  navigationState = it.navigationState.copy(isReroutingNow = true)
                              )
                          }
                          recalculateCurrentRoute()
                          return
                      }
                  }

                  val steps = route.steps
                  var bestStepIdx = state.navigationState.currentStepIndex
                  for (i in bestStepIdx until steps.size) {
                      val step = steps[i]
                      val distToStepStart = PersianTextNormalizer.haversineDistanceMeters(
                          currentLat, currentLon, step.startLat, step.startLon
                      )
                      if (distToStepStart < 25.0 && i + 1 < steps.size) {
                          bestStepIdx = i + 1
                      } else {
                          break
                      }
                  }

                  val currentStep = steps.getOrElse(bestStepIdx) { steps.last() }
                  val nextStep = steps.getOrNull(bestStepIdx + 1)
                  val distToTurn = if (nextStep != null) {
                      PersianTextNormalizer.haversineDistanceMeters(
                          currentLat, currentLon, nextStep.startLat, nextStep.startLon
                      )
                  } else {
                      distToDest
                  }

                  val activeInstruction = nextStep?.instructionTextFa ?: "مستقیم به سمت مقصد ادامه دهید"
                  val activeStreet = nextStep?.streetName ?: currentStep.streetName
                  val activeSign = nextStep?.turnSign ?: 0

                  voiceEngine.announceManeuver(
                      stepIndex = bestStepIdx,
                      instructionFa = activeInstruction,
                      streetName = activeStreet,
                      distanceToTurnMeters = distToTurn
                  )

                  val effectiveSpeedMps = max(speedKmh / 3.6, 8.5)
                  val estRemainingMillis = ((distToDest / effectiveSpeedMps) * 1000.0).toLong()

                  _uiState.update {
                      it.copy(
                          navigationState = it.navigationState.copy(
                              currentStepIndex = bestStepIdx,
                              currentInstructionFa = activeInstruction,
                              currentStreetName = activeStreet,
                              currentTurnSign = activeSign,
                              distanceToNextTurnMeters = distToTurn,
                              remainingDistanceMeters = distToDest,
                              remainingDurationMillis = estRemainingMillis,
                              isTunnelDeadReckoning = isTunnelDr,
                              isReroutingNow = false
                          )
                      )
                  }
              }

              private fun runRouteSimulationLoop(
                  route: TehranOfflineRoutingEngine.CalculatedRoute,
                  speedMultiplier: Int
              ) {
                  val points = route.geometryPoints
                  if (points.size < 2) return

                  simulationJob = viewModelScope.launch {
                      var idx = 0
                      while (isActive && idx < points.size) {
                          val (lat, lon) = points[idx]
                          val nextPt = points.getOrElse(idx + 1) { points.last() }
                          val bearing = calculateBearing(lat, lon, nextPt.first, nextPt.second)
                          val simSpeedKmh = (48f * speedMultiplier).coerceAtMost(110f)

                          _uiState.update {
                              it.copy(
                                  userLat = lat,
                                  userLon = lon,
                                  userBearing = bearing,
                                  userSpeedKmh = simSpeedKmh,
                                  constellationsSummary = "حالت شبیه‌ساز آفلاین (${speedMultiplier}x)"
                              )
                          }

                          evaluateActiveNavigationProgress(
                              currentLat = lat,
                              currentLon = lon,
                              speedKmh = simSpeedKmh,
                              isTunnelDr = false
                          )

                          idx++
                          delay((650L / speedMultiplier).coerceAtLeast(150L))
                      }
                  }
              }

              fun toggleSettingsSheet(open: Boolean) {
                  _uiState.update { it.copy(isSettingsSheetOpen = open) }
              }

              fun dismissSafetyBanner() {
                  _uiState.update { it.copy(showSafetyDisclaimerBanner = false) }
              }

              fun updateUserPreferences(transform: (NavigatorUserSettings) -> NavigatorUserSettings) {
                  viewModelScope.launch { preferencesStore.updateSettings(transform) }
              }

              fun migrateStorageLocation(targetLocation: StorageLocation) {
                  viewModelScope.launch {
                      val currentLoc = _uiState.value.settings.storageLocation
                      if (currentLoc == targetLocation) return@launch
                      val moved = storageManager.migratePackageStorage(currentLoc, targetLocation)
                      if (moved) {
                          preferencesStore.updateSettings { it.copy(storageLocation = targetLocation) }
                          val newStatus = storageManager.checkPackageStatus(targetLocation)
                          _uiState.update { it.copy(packageStatus = newStatus) }
                      }
                  }
              }

              private fun calculateBearing(lat1: Double, lon1: Double, lat2: Double, lon2: Double): Float {
                  val rLat1 = Math.toRadians(lat1)
                  val rLat2 = Math.toRadians(lat2)
                  val dLon = Math.toRadians(lon2 - lon1)
                  val y = kotlin.math.sin(dLon) * kotlin.math.cos(rLat2)
                  val x = kotlin.math.cos(rLat1) * kotlin.math.sin(rLat2) -
                          kotlin.math.sin(rLat1) * kotlin.math.cos(rLat2) * kotlin.math.cos(dLon)
                  return ((Math.toDegrees(kotlin.math.atan2(y, x)) + 360.0) % 360.0).toFloat()
              }

              override fun onCleared() {
                  super.onCleared()
                  gnssFusionEngine.stopTracking()
                  routingEngine.release()
                  placesRepository.close()
                  voiceEngine.release()
              }
          }
