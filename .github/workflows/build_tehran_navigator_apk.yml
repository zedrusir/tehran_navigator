          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          import java.util.Calendar
          import java.util.TimeZone
          import kotlin.math.acos
          import kotlin.math.cos
          import kotlin.math.sin

          private val Context.tehranNavDataStore by preferencesDataStore(name = "tehran_offline_nav_prefs")

          class TehranNavigationPreferencesStore(private val context: Context) {

              enum class AppThemePreference(val titleFa: String) {
                  AUTO_TEHRAN_SUN("خودکار (بر اساس طلوع و غروب تهران)"),
                  NIGHT_AMOLED_BLACK("شب (مشکی مطلق AMOLED)"),
                  DAY_HIGH_CONTRAST("روز (کنتراست بالا زیر آفتاب)")
              }

              enum class HardwarePerformanceMode(val titleFa: String) {
                  SMOOTH_120HZ("حداکثر نرمی (120Hz کامل)"),
                  BALANCED_ADAPTIVE("متعادل (120Hz لمس / 45Hz حرکت)"),
                  BATTERY_SAVER("ذخیره باتری (30Hz + کاهش مصرف)")
              }

              data class NavigatorUserSettings(
                  val transportMode: TransportMode = TransportMode.CAR,
                  val hasMainTrafficPermit: Boolean = false,
                  val hasAirPollutionPermit: Boolean = true,
                  val motorcyclesExemptFromPollution: Boolean = true,
                  val computeAlternativeRoutes: Boolean = true,
                  val rerouteThresholdMeters: Float = 40f,
                  val voiceGuidanceLevel: VoiceGuidanceLevel = VoiceGuidanceLevel.FULL,
                  val voiceSpeechRate: Float = 1.05f,
                  val themePreference: AppThemePreference = AppThemePreference.AUTO_TEHRAN_SUN,
                  val is3DBuildingsEnabled: Boolean = true,
                  val showTrafficZonesOverlay: Boolean = true,
                  val keepScreenOnDuringNavigation: Boolean = true,
                  val performanceMode: HardwarePerformanceMode = HardwarePerformanceMode.BALANCED_ADAPTIVE,
                  val storageLocation: StorageLocation = StorageLocation.INTERNAL_UFS
              ) {
                  fun resolveEffectiveNightMode(): Boolean {
                      return when (themePreference) {
                          AppThemePreference.NIGHT_AMOLED_BLACK -> true
                          AppThemePreference.DAY_HIGH_CONTRAST -> false
                          AppThemePreference.AUTO_TEHRAN_SUN -> isCurrentlyNightInTehran()
                      }
                  }
              }

              companion object {
                  private val KEY_TRANSPORT_MODE = stringPreferencesKey("transport_mode")
                  private val KEY_MAIN_TRAFFIC_PERMIT = booleanPreferencesKey("main_traffic_permit")
                  private val KEY_POLLUTION_PERMIT = booleanPreferencesKey("pollution_permit")
                  private val KEY_MOTO_EXEMPT = booleanPreferencesKey("moto_exempt")
                  private val KEY_ALT_ROUTES = booleanPreferencesKey("alt_routes")
                  private val KEY_REROUTE_THRESHOLD = floatPreferencesKey("reroute_threshold")
                  private val KEY_VOICE_LEVEL = stringPreferencesKey("voice_level")
                  private val KEY_VOICE_RATE = floatPreferencesKey("voice_rate")
                  private val KEY_THEME_PREF = stringPreferencesKey("theme_pref")
                  private val KEY_3D_BUILDINGS = booleanPreferencesKey("buildings_3d")
                  private val KEY_SHOW_ZONES = booleanPreferencesKey("show_traffic_zones")
                  private val KEY_KEEP_SCREEN_ON = booleanPreferencesKey("keep_screen_on")
                  private val KEY_PERF_MODE = stringPreferencesKey("perf_mode")
                  private val KEY_STORAGE_LOC = stringPreferencesKey("storage_loc")

                  fun isCurrentlyNightInTehran(timestampMillis: Long = System.currentTimeMillis()): Boolean {
                      val tehranTz = TimeZone.getTimeZone("Asia/Tehran")
                      val cal = Calendar.getInstance(tehranTz).apply { timeInMillis = timestampMillis }
                      val dayOfYear = cal.get(Calendar.DAY_OF_YEAR)
                      val currentHourDecimal = cal.get(Calendar.HOUR_OF_DAY) + (cal.get(Calendar.MINUTE) / 60.0)

                      val latRad = Math.toRadians(35.7219)
                      val lonDeg = 51.3890
                      val declination = Math.toRadians(23.44) * sin(Math.toRadians((360.0 / 365.0) * (dayOfYear - 81)))
                      val zenith = Math.toRadians(90.833)
                      val cosHourAngle = ((cos(zenith) - sin(latRad) * sin(declination)) / (cos(latRad) * cos(declination))).coerceIn(-1.0, 1.0)
                      val hourAngleDeg = Math.toDegrees(acos(cosHourAngle))

                      val b = Math.toRadians((360.0 / 365.0) * (dayOfYear - 81))
                      val eotMinutes = 9.87 * sin(2 * b) - 7.53 * cos(b) - 1.5 * sin(b)
                      val timeOffsetMinutes = 4.0 * (52.5 - lonDeg) - eotMinutes
                      val solarNoonLocal = 12.0 + (timeOffsetMinutes / 60.0)

                      val sunriseLocal = solarNoonLocal - (hourAngleDeg / 15.0)
                      val sunsetLocal = solarNoonLocal + (hourAngleDeg / 15.0)
                      return currentHourDecimal < (sunriseLocal - 0.15) || currentHourDecimal > (sunsetLocal + 0.25)
                  }
              }

              val settingsFlow: Flow<NavigatorUserSettings> = context.tehranNavDataStore.data.map { prefs ->
                  NavigatorUserSettings(
                      transportMode = prefs[KEY_TRANSPORT_MODE]?.let { runCatching { TransportMode.valueOf(it) }.getOrNull() } ?: TransportMode.CAR,
                      hasMainTrafficPermit = prefs[KEY_MAIN_TRAFFIC_PERMIT] ?: false,
                      hasAirPollutionPermit = prefs[KEY_POLLUTION_PERMIT] ?: true,
                      motorcyclesExemptFromPollution = prefs[KEY_MOTO_EXEMPT] ?: true,
                      computeAlternativeRoutes = prefs[KEY_ALT_ROUTES] ?: true,
                      rerouteThresholdMeters = prefs[KEY_REROUTE_THRESHOLD] ?: 40f,
                      voiceGuidanceLevel = prefs[KEY_VOICE_LEVEL]?.let { runCatching { VoiceGuidanceLevel.valueOf(it) }.getOrNull() } ?: VoiceGuidanceLevel.FULL,
                      voiceSpeechRate = prefs[KEY_VOICE_RATE] ?: 1.05f,
                      themePreference = prefs[KEY_THEME_PREF]?.let { runCatching { AppThemePreference.valueOf(it) }.getOrNull() } ?: AppThemePreference.AUTO_TEHRAN_SUN,
                      is3DBuildingsEnabled = prefs[KEY_3D_BUILDINGS] ?: true,
                      showTrafficZonesOverlay = prefs[KEY_SHOW_ZONES] ?: true,
                      keepScreenOnDuringNavigation = prefs[KEY_KEEP_SCREEN_ON] ?: true,
                      performanceMode = prefs[KEY_PERF_MODE]?.let { runCatching { HardwarePerformanceMode.valueOf(it) }.getOrNull() } ?: HardwarePerformanceMode.BALANCED_ADAPTIVE,
                      storageLocation = prefs[KEY_STORAGE_LOC]?.let { runCatching { StorageLocation.valueOf(it) }.getOrNull() } ?: StorageLocation.INTERNAL_UFS
                  )
              }

              suspend fun updateSettings(transform: (NavigatorUserSettings) -> NavigatorUserSettings) {
                  context.tehranNavDataStore.edit { prefs ->
                      val current = NavigatorUserSettings(
                          transportMode = prefs[KEY_TRANSPORT_MODE]?.let { runCatching { TransportMode.valueOf(it) }.getOrNull() } ?: TransportMode.CAR,
                          hasMainTrafficPermit = prefs[KEY_MAIN_TRAFFIC_PERMIT] ?: false,
                          hasAirPollutionPermit = prefs[KEY_POLLUTION_PERMIT] ?: true,
                          motorcyclesExemptFromPollution = prefs[KEY_MOTO_EXEMPT] ?: true,
                          computeAlternativeRoutes = prefs[KEY_ALT_ROUTES] ?: true,
                          rerouteThresholdMeters = prefs[KEY_REROUTE_THRESHOLD] ?: 40f,
                          voiceGuidanceLevel = prefs[KEY_VOICE_LEVEL]?.let { runCatching { VoiceGuidanceLevel.valueOf(it) }.getOrNull() } ?: VoiceGuidanceLevel.FULL,
                          voiceSpeechRate = prefs[KEY_VOICE_RATE] ?: 1.05f,
                          themePreference = prefs[KEY_THEME_PREF]?.let { runCatching { AppThemePreference.valueOf(it) }.getOrNull() } ?: AppThemePreference.AUTO_TEHRAN_SUN,
                          is3DBuildingsEnabled = prefs[KEY_3D_BUILDINGS] ?: true,
                          showTrafficZonesOverlay = prefs[KEY_SHOW_ZONES] ?: true,
                          keepScreenOnDuringNavigation = prefs[KEY_KEEP_SCREEN_ON] ?: true,
                          performanceMode = prefs[KEY_PERF_MODE]?.let { runCatching { HardwarePerformanceMode.valueOf(it) }.getOrNull() } ?: HardwarePerformanceMode.BALANCED_ADAPTIVE,
                          storageLocation = prefs[KEY_STORAGE_LOC]?.let { runCatching { StorageLocation.valueOf(it) }.getOrNull() } ?: StorageLocation.INTERNAL_UFS
                      )

                      val updated = transform(current)
                      prefs[KEY_TRANSPORT_MODE] = updated.transportMode.name
                      prefs[KEY_MAIN_TRAFFIC_PERMIT] = updated.hasMainTrafficPermit
                      prefs[KEY_POLLUTION_PERMIT] = updated.hasAirPollutionPermit
                      prefs[KEY_MOTO_EXEMPT] = updated.motorcyclesExemptFromPollution
                      prefs[KEY_ALT_ROUTES] = updated.computeAlternativeRoutes
                      prefs[KEY_REROUTE_THRESHOLD] = updated.rerouteThresholdMeters
                      prefs[KEY_VOICE_LEVEL] = updated.voiceGuidanceLevel.name
                      prefs[KEY_VOICE_RATE] = updated.voiceSpeechRate
                      prefs[KEY_THEME_PREF] = updated.themePreference.name
                      prefs[KEY_3D_BUILDINGS] = updated.is3DBuildingsEnabled
                      prefs[KEY_SHOW_ZONES] = updated.showTrafficZonesOverlay
                      prefs[KEY_KEEP_SCREEN_ON] = updated.keepScreenOnDuringNavigation
                      prefs[KEY_PERF_MODE] = updated.performanceMode.name
                      prefs[KEY_STORAGE_LOC] = updated.storageLocation.name
                  }
              }
          }
