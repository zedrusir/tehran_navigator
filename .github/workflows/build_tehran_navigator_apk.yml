          class TehranNavigationViewModel(application: Application) : AndroidViewModel(application) {

              data class RoutePointSelection(val title: String, val lat: Double, val lon: Double)

              data class ActiveTurnByTurnState(
                  val isNavigating: Boolean = false,
                  val isSimulationMode: Boolean = false,
