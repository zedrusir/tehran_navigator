# =============================================================================
# فایل جامع و خودکار (All-in-One) ساخت اپلیکیشن مسیریاب ۱۰۰٪ آفلاین کلانشهر تهران
# بهینه‌سازی شده برای سخت‌افزار Samsung Galaxy A54 5G (معماری arm64-v8a)
# =============================================================================

name: Build Complete Tehran Offline Navigator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-tehran-navigator:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: ۱. آماده‌سازی محیط و نصب Java 21 و ابزارهای پردازش نقشه
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool python3-pip curl wget unzip git
          pip3 install --break-system-packages osmium shapely

      - name: ۲. تنظیم Java 21 (سازگار با Planetiler، GraphHopper 10.0 و Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ۳. دانلود نقشه خام تهران و اجرای ممیزی ایمنی
        run: |
          mkdir -p data_pipeline
          cd data_pipeline
          wget -q https://download.geofabrik.de/asia/iran-latest.osm.pbf -O iran-latest.osm.pbf
          osmium extract -b 51.05,35.50,51.68,35.86 iran-latest.osm.pbf -o tehran_raw.osm.pbf
          osmium tags-filter tehran_raw.osm.pbf \
            --remove-tags \
            --invert-match \
            nwr/landuse=military \
            nwr/military \
            n/highway=speed_camera \
            n/enforcement \
            -o tehran_clean.osm.pbf
          rm -f iran-latest.osm.pbf tehran_raw.osm.pbf
          ls -lh tehran_clean.osm.pbf

      - name: ۴. تولید نقشه برداری فوق‌فشرده (tehran_vector.pmtiles)
        run: |
          cd data_pipeline
          wget -q https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar -O planetiler.jar
          java -Xmx4g -jar planetiler.jar \
            --osm-path=tehran_clean.osm.pbf \
            --output=tehran_vector.pmtiles \
            --bounds=51.05,35.50,51.68,35.86 \
            --languages=fa,en \
            --download
          ls -lh tehran_vector.pmtiles

      - name: ۵. ساخت بانک اطلاعاتی جامع مکان‌ها و معابر تهران (SQLite FTS5 + R*Tree)
        run: |
          cat << 'EOF' > data_pipeline/build_tehran_places_db.py
          import json
          import os
          import re
          import sqlite3
          import osmium

          ARABIC_TO_PERSIAN = str.maketrans({
              "ي": "ی", "ى": "ی", "ك": "ک", "ة": "ه", "ؤ": "و",
              "إ": "ا", "أ": "ا", "آ": "ا",
              "٠": "0", "١": "1", "٢": "2", "٣": "3", "٤": "4",
              "٥": "5", "٦": "6", "٧": "7", "٨": "8", "٩": "9",
              "۰": "0", "۱": "1", "۲": "2", "۳": "3", "۴": "4",
              "۵": "5", "۶": "6", "۷": "7", "۸": "8", "۹": "9",
          })
          DIACRITICS_REGEX = re.compile(r"[\u064B-\u065F\u0670\u0640]")

          def normalize_persian(text: str) -> str:
              if not text:
                  return ""
              text = text.translate(ARABIC_TO_PERSIAN)
              text = DIACRITICS_REGEX.sub("", text)
              text = text.replace("\u200c", " ")
              return re.sub(r"\s+", " ", text).strip().lower()

          def classify_osm_tags(tags):
              if "military" in tags or tags.get("landuse") == "military":
                  return None
              if tags.get("highway") == "speed_camera" or "enforcement" in tags:
                  return None
              if tags.get("access") in ("private", "no"):
                  return None

              amenity = tags.get("amenity", "")
              shop = tags.get("shop", "")
              railway = tags.get("railway", "")
              highway = tags.get("highway", "")
              leisure = tags.get("leisure", "")
              tourism = tags.get("tourism", "")
              place = tags.get("place", "")
              public_transport = tags.get("public_transport", "")

              if railway in ("station", "subway_entrance") or tags.get("station") == "subway":
                  return ("metro", "ایستگاه مترو", 5)
              if highway == "bus_stop" or public_transport in ("platform", "stop_position"):
                  return ("bus_brt", "ایستگاه اتوبوس و BRT", 3)
              if amenity == "fuel":
                  return ("fuel", "جایگاه سوخت (بنزین / CNG)", 5)
              if amenity == "parking":
                  return ("parking", "پارکینگ عمومی و طبقاتی", 3)
              if amenity == "hospital":
                  return ("hospital", "بیمارستان", 5)
              if amenity in ("clinic", "doctors"):
                  return ("clinic", "درمانگاه و کلینیک", 4)
              if amenity == "pharmacy":
                  return ("pharmacy", "داروخانه", 4)
              if amenity == "fire_station":
                  return ("fire_station", "ایستگاه آتش‌نشانی", 4)
              if amenity == "bank":
                  return ("bank", "شعبه بانک", 3)
              if amenity == "atm":
                  return ("atm", "خودپرداز (ATM)", 2)
              if amenity in ("university", "college"):
                  return ("university", "دانشگاه و مرکز آموزش عالی", 5)
              if amenity == "school":
                  return ("school", "مدرسه و مرکز آموزشی", 3)
              if leisure in ("park", "garden"):
                  return ("park", "بوستان و فضای سبز", 4)
              if shop in ("mall", "department_store", "supermarket"):
                  return ("shopping", "مرکز خرید و فروشگاه", 4)
              if amenity in ("restaurant", "fast_food", "cafe"):
                  return ("food", "رستوران و کافه", 3)
              if tourism in ("museum", "gallery", "attraction"):
                  return ("tourism", "موزه و جاذبه گردشگری", 4)
              if place in ("suburb", "quarter", "neighbourhood", "district"):
                  return ("neighborhood", "محله و منطقه شهری", 5)
              return None

          class TehranOsmExtractor(osmium.SimpleHandler):
              def __init__(self):
                  super().__init__()
                  self.places = []
                  self.seen_streets = set()

              def _get_persian_name(self, tags):
                  return tags.get("name:fa") or tags.get("name") or tags.get("alt_name:fa")

              def _build_address_hint(self, tags):
                  parts = []
                  district = tags.get("addr:district") or tags.get("is_in:suburb")
                  street = tags.get("addr:street")
                  if district:
                      parts.append(f"محله {district}")
                  if street:
                      parts.append(f"خیابان {street}")
                  return "، ".join(parts) if parts else "کلانشهر تهران"

              def _process_element(self, tags, lat, lon, osm_id):
                  if "military" in tags or tags.get("landuse") == "military" or tags.get("highway") == "speed_camera":
                      return
                  name = self._get_persian_name(tags)
                  if not name:
                      return

                  highway = tags.get("highway")
                  if highway in (
                      "motorway", "trunk", "primary", "secondary", "tertiary",
                      "residential", "unclassified", "living_street", "pedestrian"
                  ):
                      grid_key = (normalize_persian(name), round(lat, 2), round(lon, 2))
                      if grid_key not in self.seen_streets:
                          self.seen_streets.add(grid_key)
                          road_type_fa = {
                              "motorway": "بزرگراه",
                              "trunk": "بزرگراه / شریان اصلی",
                              "primary": "خیابان اصلی",
                              "secondary": "خیابان فرعی",
                              "tertiary": "خیابان محلی",
                              "residential": "کوچه / معبر مسکونی",
                          }.get(highway, "معبر شهری")
                          prio = 4 if highway in ("motorway", "trunk", "primary") else 2
                          self.places.append((
                              osm_id, name, normalize_persian(name), "street", road_type_fa,
                              self._build_address_hint(tags), "", "", lat, lon, prio
                          ))
                      return

                  classified = classify_osm_tags(tags)
                  if classified:
                      cat_code, cat_fa, priority = classified
                      self.places.append((
                          osm_id, name, normalize_persian(name), cat_code, cat_fa,
                          self._build_address_hint(tags),
                          tags.get("phone") or tags.get("contact:phone", ""),
                          tags.get("opening_hours", ""),
                          lat, lon, priority
                      ))

              def node(self, n):
                  if n.location.valid():
                      self._process_element(dict(n.tags), n.location.lat, n.location.lon, n.id)

              def way(self, w):
                  tags = dict(w.tags)
                  if not self._get_persian_name(tags):
                      return
                  coords = [(nd.lat, nd.lon) for nd in w.nodes if nd.location.valid()]
                  if coords:
                      mid_lat, mid_lon = coords[len(coords) // 2]
                      self._process_element(tags, mid_lat, mid_lon, w.id)

              def area(self, a):
                  try:
                      tags = dict(a.tags)
                      if not self._get_persian_name(tags):
                          return
                      lats, lons = [], []
                      for outer in a.outer_rings():
                          for nd in outer:
                              if nd.valid():
                                  lats.append(nd.lat)
                                  lons.append(nd.lon)
                      if lats and lons:
                          self._process_element(tags, sum(lats)/len(lats), sum(lons)/len(lons), a.id)
                  except Exception:
                      pass

          TEHRAN_TRAFFIC_ZONES = [
              {
                  "zone_id": "main_traffic_zone",
                  "title_fa": "محدوده طرح ترافیک اصلی تهران",
                  "active_days": "شنبه تا چهارشنبه (۰۶:۳۰ تا ۱۸:۰۰)",
                  "description": "محدوده مرکزی تهران",
                  "polygon": [
                      [51.3912, 35.7245], [51.4345, 35.7248], [51.4410, 35.6980],
                      [51.4365, 35.6675], [51.3920, 35.6680], [51.3895, 35.7010],
                      [51.3912, 35.7245]
                  ]
              },
              {
                  "zone_id": "air_pollution_zone",
                  "title_fa": "محدوده کنترل آلودگی هوا (زوج و فرد سابق)",
                  "active_days": "شنبه تا چهارشنبه (۰۶:۳۰ تا ۱۸:۰۰) و پنج‌شنبه‌ها (۰۶:۳۰ تا ۱۳:۰۰)",
                  "description": "محدوده بزرگراه‌های همت، امام علی، بعثت و چمران/نواب",
                  "polygon": [
                      [51.3765, 35.7485], [51.4610, 35.7460], [51.4655, 35.6520],
                      [51.3720, 35.6540], [51.3765, 35.7485]
                  ]
              }
          ]

          def main():
              extractor = TehranOsmExtractor()
              extractor.apply_file("data_pipeline/tehran_clean.osm.pbf", locations=True, idx="flex_mem")
              print(f"Total Tehran places & streets extracted: {len(extractor.places)}")

              db_path = "data_pipeline/tehran_places_fts5.db"
              if os.path.exists(db_path):
                  os.remove(db_path)

              conn = sqlite3.connect(db_path)
              cur = conn.cursor()
              cur.executescript("""
                  PRAGMA journal_mode = OFF;
                  PRAGMA synchronous = OFF;
                  PRAGMA page_size = 4096;
                  CREATE TABLE android_metadata (locale TEXT);
                  INSERT INTO android_metadata VALUES ('fa_IR');
                  CREATE TABLE places (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      osm_id INTEGER,
                      name TEXT NOT NULL,
                      name_normalized TEXT NOT NULL,
                      category TEXT NOT NULL,
                      category_fa TEXT NOT NULL,
                      address_hint TEXT,
                      phone TEXT,
                      opening_hours TEXT,
                      lat REAL NOT NULL,
                      lon REAL NOT NULL,
                      priority INTEGER DEFAULT 2
                  );
                  CREATE VIRTUAL TABLE places_fts USING fts5(
                      name_normalized, category_fa, address_hint,
                      content='places', content_rowid='id', tokenize='unicode61'
                  );
                  CREATE VIRTUAL TABLE places_rtree USING rtree(id, min_lat, max_lat, min_lon, max_lon);
                  CREATE TABLE traffic_zones (
                      zone_id TEXT PRIMARY KEY,
                      title_fa TEXT NOT NULL,
                      active_days TEXT NOT NULL,
                      description TEXT,
                      polygon_json TEXT NOT NULL
                  );
              """)

              cur.executemany("""
                  INSERT INTO places (
                      osm_id, name, name_normalized, category, category_fa,
                      address_hint, phone, opening_hours, lat, lon, priority
                  ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
              """, extractor.places)

              cur.executescript("""
                  INSERT INTO places_fts (rowid, name_normalized, category_fa, address_hint)
                  SELECT id, name_normalized, category_fa, address_hint FROM places;
                  INSERT INTO places_rtree (id, min_lat, max_lat, min_lon, max_lon)
                  SELECT id, lat, lat, lon, lon FROM places;
                  CREATE INDEX idx_places_category ON places(category);
                  CREATE INDEX idx_places_priority ON places(priority DESC);
              """)

              for z in TEHRAN_TRAFFIC_ZONES:
                  cur.execute(
                      "INSERT INTO traffic_zones VALUES (?, ?, ?, ?, ?)",
                      (z["zone_id"], z["title_fa"], z["active_days"], z["description"], json.dumps(z["polygon"]))
                  )

              # تست خودکار جستجوی خیابان‌های اصلی تهران (ولیعصر و همت)
              valiasr_count = cur.execute(
                  "SELECT COUNT(*) FROM places_fts WHERE places_fts MATCH '\"ولیعصر\"*'"
              ).fetchone()[0]
              hemmat_count = cur.execute(
                  "SELECT COUNT(*) FROM places_fts WHERE places_fts MATCH '\"همت\"*'"
              ).fetchone()[0]
              print(f"FTS5 Verification -> ولیعصر: {valiasr_count} matches | همت: {hemmat_count} matches")

              conn.commit()
              cur.execute("VACUUM;")
              conn.close()

          if __name__ == "__main__":
              main()
          EOF
          python3 data_pipeline/build_tehran_places_db.py
          ls -lh data_pipeline/tehran_places_fts5.db

      - name: ۶. ساخت گراف مسیریابی آفلاین تهران با GraphHopper 10.0
        run: |
          cd data_pipeline
          wget -q https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/10.0/graphhopper-web-10.0.jar -O graphhopper-web-10.0.jar
          cat << 'EOF' > graphhopper_tehran_config.yml
          graphhopper:
            datareader.file: tehran_clean.osm.pbf
            graph.location: tehran_routing_graph
            graph.dataaccess: MMAP
            graph.encoded_values: car_access, car_average_speed, foot_access, foot_average_speed, motorcycle_access, motorcycle_average_speed, max_speed, road_class, road_access, surface, toll
            profiles:
              - name: car
                turn_costs:
                  vehicle_types: [motorcar, motor_vehicle]
                custom_model_files: [car.json]
              - name: motorcycle
                turn_costs:
                  vehicle_types: [motorcycle, motor_vehicle]
                custom_model_files: [motorcycle.json]
              - name: foot
                custom_model_files: [foot.json]
            profiles_ch:
              - profile: car
              - profile: motorcycle
              - profile: foot
            profiles_lm:
              - profile: car
              - profile: motorcycle
            prepare.min_network_size: 200
            routing.non_ch.max_waypoint_distance: 1000000
          server:
            application_connectors:
              - type: http
                port: 8989
                bind_host: localhost
          EOF
          java -Xmx4g -jar graphhopper-web-10.0.jar import graphhopper_tehran_config.yml
          ls -lh tehran_routing_graph

      - name: ۷. دریافت فونت‌های برداری فارسی (Glyphs) و آیکون‌های آفلاین (Sprites)
        run: |
          git clone --depth 1 https://github.com/protomaps/basemaps-assets.git data_pipeline/basemaps-assets
          mkdir -p "app/src/main/assets/map/glyphs/Noto Sans Medium"
          cp -r "data_pipeline/basemaps-assets/fonts/Noto Sans Medium/"*.pbf "app/src/main/assets/map/glyphs/Noto Sans Medium/"
          mkdir -p app/src/main/assets/map/sprites
          cp data_pipeline/basemaps-assets/sprites/v4/dark.json app/src/main/assets/map/sprites/sprite.json
          cp data_pipeline/basemaps-assets/sprites/v4/dark.png app/src/main/assets/map/sprites/sprite.png
          cp data_pipeline/basemaps-assets/sprites/v4/dark@2x.json app/src/main/assets/map/sprites/sprite@2x.json
          cp data_pipeline/basemaps-assets/sprites/v4/dark@2x.png app/src/main/assets/map/sprites/sprite@2x.png

      - name: ۸. تولید کامل کدهای پروژه اندروید و ادغام داده‌های آفلاین تهران
        run: |
          python3 << 'EOF'
          import os
          import shutil

          def write_file(path, content):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content.lstrip("\n"))

          # 1. Gradle Root & Settings
          write_file("settings.gradle.kts", '''
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TehranOfflineNavigator"
          include(":app")
          ''')

          write_file("build.gradle.kts", '''
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          ''')

          write_file("gradle.properties", '''
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          ''')

          # 2. App build.gradle.kts (GraphHopper 10.0 + MapLibre + Compose + Release Signing)
          write_file("app/build.gradle.kts", '''
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "ir.tehran.navigator"
              compileSdk = 35

              defaultConfig {
                  applicationId = "ir.tehran.navigator"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0-tehran-a54"

                  ndk {
                      abiFilters += listOf("arm64-v8a")
                  }
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("tehran_release.keystore")
                      storePassword = "tehran_offline_key"
                      keyAlias = "tehran_nav"
                      keyPassword = "tehran_offline_key"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              androidResources {
                  noCompress += listOf("pmtiles", "db", "pbf", "bin")
              }

              packaging {
                  resources {
                      excludes += setOf(
                          "META-INF/DEPENDENCIES",
                          "META-INF/LICENSE",
                          "META-INF/LICENSE.txt",
                          "META-INF/NOTICE",
                          "META-INF/NOTICE.txt",
                          "META-INF/INDEX.LIST"
                      )
                  }
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")

              implementation("org.maplibre.gl:android-sdk:11.8.0")

              implementation("com.graphhopper:graphhopper-core:10.0") {
                  exclude(group = "com.google.protobuf", module = "protobuf-java")
                  exclude(group = "org.openstreetmap.osmosis", module = "osmosis-osm-binary")
                  exclude(group = "org.apache.xmlgraphics", module = "xmlgraphics-commons")
              }
              implementation("org.slf4j:slf4j-android:1.7.36")

              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
          }
          ''')

          # 3. AndroidManifest.xml & Resources
          write_file("app/src/main/AndroidManifest.xml", '''
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <uses-feature android:name="android.hardware.location.gps" android:required="true" />
              <uses-feature android:glEsVersion="0x00030002" android:required="true" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="مسیریاب آفلاین تهران"
                  android:largeHeap="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          ''')

          write_file("app/src/main/res/values/colors.xml", '''
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#064E3B</color>
          </resources>
          ''')

          write_file("app/src/main/res/drawable/ic_launcher_foreground.xml", '''
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#10B981"
                  android:pathData="M54,24L74,80L54,68L34,80Z" />
          </vector>
          ''')

          write_file("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml", '''
          <?xml version="1.0" encoding="utf-8"?>
